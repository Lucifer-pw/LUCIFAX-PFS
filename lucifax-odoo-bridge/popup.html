<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lucifax Odoo Assistant</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      margin-bottom: 12px;
    }
    .title {
      font-weight: bold;
      color: #38BDF8;
      font-size: 13px;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .inv-title {
      color: #38BDF8;
      font-weight: bold;
      font-size: 13px;
    }
    .inv-subtitle {
      color: #94A3B8;
      font-size: 11px;
      margin-top: 4px;
    }
    .footer {
      font-size: 10.5px;
      color: #64748B;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">⚡</span>
    <div class="title">Lucifax Odoo Assistant</div>
  </div>

  <div class="card" id="card-content">
    <div id="status-text" style="color: #94A3B8;">Memeriksa data invoice...</div>
  </div>

  <div class="footer">
    Buka <b>erp.fivafood.co.id:8069</b> di sebelah tab Lucifax PFS untuk menggunakan tombol Auto-Fill otomatis.
  </div>

  <script src="popup.js"></script>
</body>
</html>
