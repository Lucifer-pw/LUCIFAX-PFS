name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: stable

      - name: Configure Gradle Maven Mirrors (Fix 429 Too Many Requests)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.init.gradle
          gradle.settingsEvaluated { settings ->
              try {
                  settings.pluginManagement.repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              } catch (Throwable ignored) {}
              try {
                  settings.dependencyResolutionManagement.repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              } catch (Throwable ignored) {}
          }
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
                              repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                      }
                  }
              }
          }
          EOF
          echo "Created ~/.gradle/init.d/mirror.init.gradle successfully"

          FLUTTER_SETTINGS=$(find "$FLUTTER_ROOT" -name "settings.gradle.kts" 2>/dev/null | grep "flutter_tools/gradle" | head -n 1)
          if [ -n "$FLUTTER_SETTINGS" ] && [ -f "$FLUTTER_SETTINGS" ]; then
              sed -i 's|mavenCentral()|maven(url = "https://maven-central.storage-download.googleapis.com/maven2/")\n    mavenCentral()|g' "$FLUTTER_SETTINGS"
              echo "Patched Flutter tools internal settings.gradle.kts at $FLUTTER_SETTINGS"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk

      - name: Rename APK file
        run: mv app-release.apk Lucifax-PFS_${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'LUCIFAX PFS ${{ github.ref_name }}'
          files: Lucifax-PFS_${{ github.ref_name }}.apk
          generate_release_notes: false
